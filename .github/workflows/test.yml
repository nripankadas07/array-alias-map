name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest -v test_core
      - run: python -m compileall -q array_alias_map.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Clean installed-wheel example
        run: |
          python -m venv /tmp/project-example
          /tmp/project-example/bin/python -m pip install dist/*.whl
          PATH="/tmp/project-example/bin:$PATH" EXAMPLE_PYTHON=/tmp/project-example/bin/python python check_installed_cli.py
